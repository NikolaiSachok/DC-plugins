name: Release image-wlx

# Tag a release: git tag image-wlx-v0.1.0 && git push origin image-wlx-v0.1.0
on:
  push:
    tags:
      - 'image-wlx-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build universal plugin
        working-directory: image-wlx
        run: ./build.sh

      - name: Assemble install bundle
        working-directory: image-wlx
        run: |
          BUNDLE="ImageView"
          rm -rf "$BUNDLE" && mkdir "$BUNDLE"
          cp build/ImageView.wlx "$BUNDLE"/
          cp install.sh register_plugin.py README.md THIRD_PARTY_LICENSES.md "$BUNDLE"/
          zip -rqy "ImageView-${GITHUB_REF_NAME}.zip" "$BUNDLE"
          shasum -a 256 "ImageView-${GITHUB_REF_NAME}.zip" > "ImageView-${GITHUB_REF_NAME}.zip.sha256"
          ls -la *.zip*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Prebuilt universal (arm64 + x86_64) `ImageView.wlx` for Double Commander on macOS.

            Views images and PDFs in the F3 viewer and Quick View — zoom (pinch, Cmd+scroll,
            Cmd+= / Cmd+-) and pan (drag) with crisp, vector SVG at any zoom; PNG,
            JPEG, HEIC, WebP, AVIF, GIF (animated), TIFF, RAW and 60+ other formats;
            pixel size, format and file size in the toolbar. PDFs scroll continuously,
            stay vector-sharp, and support text selection and copying. Drag to select
            PDF text; Option-drag pans. Re-run the installer after upgrading to
            register PDF support ahead of MacPreview.

            **Install (no Xcode needed):** unzip, quit Double Commander, then run `./install.sh`.
            Verify the download with the included `.sha256`.
          files: |
            image-wlx/ImageView-${{ github.ref_name }}.zip
            image-wlx/ImageView-${{ github.ref_name }}.zip.sha256
