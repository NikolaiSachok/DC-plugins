name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  leak-guard:
    name: Leak guard (generic secrets/paths)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/leak-guard.sh

  build:
    name: Build & verify (macOS, universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build markdown-wlx
        working-directory: markdown-wlx
        run: ./build.sh

      - name: Assert universal binary (arm64 + x86_64)
        working-directory: markdown-wlx
        run: |
          archs=$(lipo -archs build/MarkdownView.wlx)
          echo "archs: $archs"
          echo "$archs" | grep -q arm64
          echo "$archs" | grep -q x86_64

      - name: Assert WLX entry points are exported
        working-directory: markdown-wlx
        run: |
          for sym in _ListLoad _ListLoadNext _ListCloseWindow \
                     _ListGetDetectString _ListSetDefaultParams _ListSendCommand \
                     _ListSearchTextW _ListPrintW; do
            nm -gU build/MarkdownView.wlx | grep -q " T $sym" \
              || { echo "missing export: $sym"; exit 1; }
          done
          echo "all WLX exports present ✓"

      - name: Compile Markdown printing harness
        working-directory: markdown-wlx
        run: |
          clang -fobjc-arc -framework Cocoa -framework WebKit -framework PDFKit \
            -o build/print_verify test/print_verify.m

      # The WKWebView render + Esc tests under test/ are GUI-bound and run
      # locally (see markdown-wlx/README.md), not on the headless CI runner.

      - name: Build book-wlx
        working-directory: book-wlx
        run: ./build.sh

      - name: Assert universal binary (arm64 + x86_64)
        working-directory: book-wlx
        run: |
          archs=$(lipo -archs build/BookView.wlx)
          echo "archs: $archs"
          echo "$archs" | grep -q arm64
          echo "$archs" | grep -q x86_64

      - name: Assert WLX entry points are exported
        working-directory: book-wlx
        run: |
          for sym in _ListLoad _ListLoadNext _ListCloseWindow \
                     _ListGetDetectString _ListSetDefaultParams _ListSendCommand \
                     _ListSearchTextW; do
            nm -gU build/BookView.wlx | grep -q " T $sym" \
              || { echo "missing export: $sym"; exit 1; }
          done
          echo "all WLX exports present ✓"

      # The ZIP/OCF reader is not GUI-bound, so its harness runs here against
      # generated sample books. The rendering, TOC and sanitising assertions in
      # test/test_host.m need a WebKit-capable session and run locally.
      - name: Run book-wlx ZIP reader harness
        working-directory: book-wlx
        run: |
          python3 test/make_samples.py build/samples
          clang -O1 -Wall -Wextra -o build/zip_test test/zip_test.c zipreader.c -lz
          ./build/zip_test build/samples

      - name: Build image-wlx
        working-directory: image-wlx
        run: ./build.sh

      - name: Assert universal binary (arm64 + x86_64)
        working-directory: image-wlx
        run: |
          archs=$(lipo -archs build/ImageView.wlx)
          echo "archs: $archs"
          echo "$archs" | grep -q arm64
          echo "$archs" | grep -q x86_64

      - name: Assert WLX entry points are exported
        working-directory: image-wlx
        run: |
          for sym in _ListLoad _ListLoadNext _ListCloseWindow \
                     _ListGetDetectString _ListSetDefaultParams _ListSendCommand; do
            nm -gU build/ImageView.wlx | grep -q " T $sym" \
              || { echo "missing export: $sym"; exit 1; }
          done
          echo "all WLX exports present ✓"

      # The image viewer is AppKit only (no WebKit), so its harnesses run here
      # against generated samples: formats, fall-through, opening zoom, zoom
      # keys, mouse, animation, FP traps, Esc, focus and copy.
      - name: Run image-wlx harnesses (real artifact)
        working-directory: image-wlx
        run: |
          clang -fobjc-arc -Wall -framework Cocoa -framework ImageIO \
            -framework UniformTypeIdentifiers -lz -o build/make_samples test/make_samples.m
          ./build/make_samples build/samples
          for t in test_host esc_verify focus_verify copy_verify; do
            clang -fobjc-arc -Wall -Wextra -framework Cocoa -o build/$t test/$t.m
          done
          ./build/test_host build/ImageView.wlx build/samples
          ./build/esc_verify build/ImageView.wlx build/samples/photo.jpg
          ./build/focus_verify build/ImageView.wlx build/samples/photo.jpg
          ./build/copy_verify build/ImageView.wlx build/samples

      - name: Build media-info-wdx
        working-directory: media-info-wdx
        run: ./build.sh

      - name: Assert universal binary (arm64 + x86_64)
        working-directory: media-info-wdx
        run: |
          archs=$(lipo -archs build/MediaInfo.wdx)
          echo "archs: $archs"
          echo "$archs" | grep -q arm64
          echo "$archs" | grep -q x86_64

      - name: Assert WDX entry points are exported
        working-directory: media-info-wdx
        run: |
          for sym in _ContentGetSupportedField _ContentGetValue \
                     _ContentGetSupportedFieldFlags _ContentGetDetectString \
                     _ContentSetDefaultParams _ContentPluginUnloading; do
            nm -gU build/MediaInfo.wdx | grep -q " T $sym" \
              || { echo "missing export: $sym"; exit 1; }
          done
          echo "all WDX exports present ✓"

      # Unlike the markdown viewer, the content plugin is not GUI-bound: the
      # harness synthesizes sample files and drives the real ABI headlessly.
      - name: Run media-info-wdx harness (real artifact)
        working-directory: media-info-wdx
        run: |
          clang -arch arm64 -fobjc-arc -framework Foundation \
            -framework CoreGraphics -framework ImageIO \
            -o build/test_host test/test_host.m
          ./build/test_host build/MediaInfo.wdx
