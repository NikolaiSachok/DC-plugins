name: Release epub-wlx

# Tag a release: git tag epub-wlx-v0.1.0 && git push origin epub-wlx-v0.1.0
on:
  push:
    tags:
      - 'epub-wlx-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build universal plugin
        working-directory: epub-wlx
        run: ./build.sh

      - name: Assemble install bundle
        working-directory: epub-wlx
        run: |
          BUNDLE="EpubView"
          rm -rf "$BUNDLE" && mkdir "$BUNDLE"
          cp build/EpubView.wlx "$BUNDLE"/
          cp -R assets "$BUNDLE"/assets
          cp install.sh register_plugin.py README.md \
             THIRD_PARTY_LICENSES.md EpubView.ini.sample "$BUNDLE"/
          zip -rqy "EpubView-${GITHUB_REF_NAME}.zip" "$BUNDLE"
          shasum -a 256 "EpubView-${GITHUB_REF_NAME}.zip" > "EpubView-${GITHUB_REF_NAME}.zip.sha256"
          ls -la *.zip*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Prebuilt universal (arm64 + x86_64) `EpubView.wlx` for Double Commander on macOS.

            Opens `.epub` e-books in the F3 viewer — contents sidebar, continuous
            reflowable text, cover, light/dark/sepia.

            **Install (no Xcode needed):** unzip, quit Double Commander, then run `./install.sh`.
            Verify the download with the included `.sha256`.
          files: |
            epub-wlx/EpubView-${{ github.ref_name }}.zip
            epub-wlx/EpubView-${{ github.ref_name }}.zip.sha256
