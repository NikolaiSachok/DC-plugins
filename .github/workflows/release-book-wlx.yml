name: Release book-wlx

# Tag a release: git tag book-wlx-v0.1.0 && git push origin book-wlx-v0.1.0
on:
  push:
    tags:
      - 'book-wlx-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build universal plugin
        working-directory: book-wlx
        run: ./build.sh

      - name: Assemble install bundle
        working-directory: book-wlx
        run: |
          BUNDLE="BookView"
          rm -rf "$BUNDLE" && mkdir "$BUNDLE"
          cp build/BookView.wlx "$BUNDLE"/
          cp -R assets "$BUNDLE"/assets
          cp install.sh register_plugin.py README.md \
             THIRD_PARTY_LICENSES.md BookView.ini.sample "$BUNDLE"/
          zip -rqy "BookView-${GITHUB_REF_NAME}.zip" "$BUNDLE"
          shasum -a 256 "BookView-${GITHUB_REF_NAME}.zip" > "BookView-${GITHUB_REF_NAME}.zip.sha256"
          ls -la *.zip*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Prebuilt universal (arm64 + x86_64) `BookView.wlx` for Double Commander on macOS.

            Opens `.epub`, `.fb2` and `.fbz` e-books in the F3 viewer — contents
            sidebar, continuous reflowable text, cover, light/dark/sepia.

            **Install (no Xcode needed):** unzip, quit Double Commander, then run `./install.sh`.
            Verify the download with the included `.sha256`.
          files: |
            book-wlx/BookView-${{ github.ref_name }}.zip
            book-wlx/BookView-${{ github.ref_name }}.zip.sha256
