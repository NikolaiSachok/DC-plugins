name: Release table-wlx

# Tag a release: git tag table-wlx-v0.1.0 && git push origin table-wlx-v0.1.0
on:
  push:
    tags:
      - 'table-wlx-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build universal plugin
        working-directory: table-wlx
        run: ./build.sh

      - name: Check tag matches plugin version
        working-directory: table-wlx
        run: |
          version=$(sed -n 's/^#define TV_VERSION "\([^"]*\)"/\1/p' TableView.m)
          test "$GITHUB_REF_NAME" = "table-wlx-v$version"

      - name: Run real-artifact tests
        working-directory: table-wlx
        run: ./test/run.sh

      - name: Assemble install bundle
        working-directory: table-wlx
        run: |
          BUNDLE="TableView"
          rm -rf "$BUNDLE" && mkdir "$BUNDLE"
          cp build/TableView.wlx "$BUNDLE"/
          cp install.sh register_plugin.py README.md THIRD_PARTY_LICENSES.md "$BUNDLE"/
          mkdir -p "$BUNDLE/assets"
          cp assets/SHEETJS-LICENSE.txt "$BUNDLE/assets/"
          zip -rqy "TableView-${GITHUB_REF_NAME}.zip" "$BUNDLE"
          shasum -a 256 "TableView-${GITHUB_REF_NAME}.zip" > "TableView-${GITHUB_REF_NAME}.zip.sha256"
          ls -la *.zip*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Prebuilt universal (arm64 + x86_64) `TableView.wlx` for Double Commander on macOS.

            Read-only native previews for CSV, TSV, Excel, Apple Numbers and OpenDocument
            spreadsheets, plus DIF, SYLK and dBASE. Select cells and rectangular ranges,
            copy values as TSV, switch worksheets and search. No Office installation
            or network connection required. The parser is embedded in the binary.

            **Install (no Xcode needed):** unzip, quit Double Commander, then run `./install.sh`.
            Verify the download with the included `.sha256`.
          files: |
            table-wlx/TableView-${{ github.ref_name }}.zip
            table-wlx/TableView-${{ github.ref_name }}.zip.sha256
